name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q
      - name: dogfood the gate on the example agent
        working-directory: examples
        run: |
          holdline run --suite refund_cases.jsonl --target refund_agent:agent_v1 -k 3 --out /tmp/v1.json -q
          holdline gate --baseline /tmp/v1.json --candidate /tmp/v1.json
