[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "holdline"
version = "0.2.1"
description = "Eval and regression gate for AI agents: trajectory checks, pass^k, judge calibration, paired statistics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aashan Javed" }]
keywords = ["llm", "agents", "evals", "evaluation", "ci", "llm-as-judge", "reliability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=7"]

[project.scripts]
holdline = "holdline.cli:main"

[project.urls]
Homepage = "https://www.aashanjaved.com/holdline/"
Source = "https://github.com/Aashan47/holdline"
Issues = "https://github.com/Aashan47/holdline/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
holdline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["site", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E731"]   # long data/HTML lines and small lambdas are deliberate here
